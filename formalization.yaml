version: v0.4
project:
  name: The square-lattice spin-2 AKLT spectral gap
  description: >-
    Formalizes the unconditional all-parity AKLT theorem: nonvanishing and
    uniqueness of the VBS ground state on every torus with periods at least
    three, and a uniform positive spectral gap for all sufficiently large
    periods. The finite H1 and H3 certificate libraries are part of the proof.
    The manuscript, mathematical proofs, certificate generators, and checked
    finite-input interfaces are included in one source tree.
