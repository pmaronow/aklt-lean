version: v0.4
project:
  name: The square-lattice spin-2 AKLT gap from two explicit inputs
  description: >-
    Formalizes the deterministic reduction from the paper's pointwise local
    partition inequality (H1), at 961/1000 and 187/200, and its all-cutoff
    positive-vector kernel bound (H3_h), to nonvanishing and uniqueness of the
    VBS ground state on every torus with periods at least three and a uniform
    positive spectral gap for all sufficiently large periods of either parity.
    The open-trail input (H2) is proved internally. H1 and H3_h are explicit
    premises; their finite certificate verification belongs to a separate
    companion artifact and is outside this submission's certified claims.
