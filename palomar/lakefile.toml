name = "akltPalomar"
version = "0.1.0"
defaultTargets = ["Solution", "Audit"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# Populate AKLT/ with exactly port-list.tsv before the standalone source build.
[[lean_lib]]
name = "AKLT"
roots = ["AKLT.Final.Inputs"]
globs = ["AKLT.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Audit"
