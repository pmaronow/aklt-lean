name = "aklt_lean"
version = "0.1.0"
defaultTargets = ["AKLT"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "AKLT"
globs = ["AKLT", "AKLT.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# Generated certificate data and computations are opt-in.
[[lean_lib]]
name = "CertData"
globs = ["CertData"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# H1 attachment, separate from the ordinary AKLT and shared CertData roots.
[[lean_lib]]
name = "CertDataH1"
roots = ["CertData.H1.Generated"]
globs = ["CertData.H1.Generated.Batch.+", "CertData.H1.Generated.Bridge.+", "CertData.H1.Close.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
